name: agent-run-linux

# 目的：验证"在别处跑 agent"这条通道本身成立 —— oag run 签票据 → 假宿主干活 →
#       越界被拒 → 熔断 → wrapper 杀进程（退出码 13）。
# 这一步不需要任何模型密钥，所以可以常态化跑。
# 真跑 codex 的 job 需要仓库 secret DEEPSEEK_API_KEY；没配就自动跳过。

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  harness-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 准备独立用户 + 工作目录 + 策略 + 闸门
        run: |
          set -eux
          # /home/runner 不可被其他账号穿越，把应用拷到公共可读位置
          sudo cp -a "$GITHUB_WORKSPACE" /opt/oag-app
          sudo chmod -R a+rX /opt/oag-app
          sudo useradd -m -s /bin/bash agent_runner
          sudo mkdir -p /srv/agent-work /srv/codex-home
          sudo chown -R agent_runner:agent_runner /srv/agent-work
          cat > /tmp/policy.json <<'JSON'
          {"version":1,"rules":[
            {"action":"WRITE","decision":"allow","scope":{"paths":["/srv/agent-work/**"]}},
            {"action":"READ","decision":"allow","scope":{"paths":["/srv/agent-work/**"]}},
            {"action":"EXEC_SAFE","decision":"allow","scope":{}},
            {"action":"EXEC_DESTRUCTIVE","decision":"deny","scope":{}},
            {"action":"NET","decision":"deny","scope":{}}
          ]}
          JSON
          sudo cp /tmp/policy.json /srv/codex-home/policy.json
          mkdir -p /tmp/gen
          cd /opt/oag-app && node -e 'import("./src/adapter/codex/guard.js").then(m=>m.install({codexHome:"/tmp/gen", policyPath:"/srv/codex-home/policy.json", auditPath:"/srv/agent-work/audit.jsonl"}))'
          sudo cp /tmp/gen/oag-guard.mjs /srv/codex-home/oag-guard.mjs
          sudo cp /tmp/gen/oag-shim.mjs /srv/codex-home/oag-shim.mjs 2>/dev/null || true
          # 票据目录要能被 agent 写（wrapper 以 agent 身份签票），但 codex-home 本身保持 root 属主，
          # 否则 agent 可以删掉闸门脚本（抗篡改就没了）
          sudo mkdir -p /srv/codex-home/.oag-sessions
          sudo chown agent_runner /srv/codex-home/.oag-sessions
          sudo chown root:root /srv/codex-home /srv/codex-home/oag-guard.mjs /srv/codex-home/policy.json
          sudo chmod 755 /srv/codex-home /srv/codex-home/oag-guard.mjs
          sudo chmod 644 /srv/codex-home/policy.json

      - name: 跑 oag run + 假宿主（期望：越界被拒 → 熔断 → 被杀，退出码 13）
        id: run
        run: |
          # 注意：Actions 的 bash 默认带 -e；wrapper 正常返回 13 时会让脚本提前中断，
          # 所以这里必须临时关掉 -e，先取 PIPESTATUS 再判断
          set +e
          set -o pipefail
          cd /srv/agent-work
          sudo -u agent_runner env PATH="$PATH" node /opt/oag-app/bin/oag.js run \
            --max-denies 2 \
            --cwd /srv/agent-work \
            --codex-home /srv/codex-home \
            --policy /srv/codex-home/policy.json \
            --no-canary \
            -- node /opt/oag-app/scripts/fake-host.mjs --guard /srv/codex-home/oag-guard.mjs --root /srv/agent-work \
            | tee /tmp/run.txt
          CODE=${PIPESTATUS[0]}
          set -e
          echo "wrapper_exit=$CODE" | tee -a /tmp/run.txt
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: 结论
        run: |
          echo "退出码: ${{ steps.run.outputs.exit_code }}"
          grep -E "fake-host|熔断|越界计数|wrapper_exit" /tmp/run.txt || true
          test "${{ steps.run.outputs.exit_code }}" = "13"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-run-linux
          path: /tmp/run.txt
