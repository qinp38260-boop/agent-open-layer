name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: unit tests
        run: node --test tests/adapter.test.mjs tests/host.test.mjs tests/patchfile.test.mjs tests/policy.test.mjs tests/actions.test.mjs tests/audit-policy.test.mjs tests/codex-hooks.test.mjs tests/v3.test.mjs tests/v4.test.mjs
      - name: CLI smoke (status must not throw)
        run: node bin/dsh-open.js status
